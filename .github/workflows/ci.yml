name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build-test:
    name: build e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # Mesmo major do Supabase (ADR-001). Banco descartável, só para testes.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # O superusuário do contêiner só cria os papéis (bootstrap). Os testes rodam como na nuvem:
      # dono sem superusuário (fixtures e GRANTs) e aplicação sem BYPASSRLS. Senhas descartáveis.
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      LIAME_OWNER_PASSWORD: liame_owner_ci
      LIAME_APP_PASSWORD: liame_app_ci
      TEST_DATABASE_URL_OWNER: postgresql://liame_owner:liame_owner_ci@localhost:5432/liame_test
      TEST_DATABASE_URL: postgresql://liame_app:liame_app_ci@localhost:5432/liame_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Histórico completo: o oasdiff compara com o contrato da base do PR.
          fetch-depth: 0

      # Sem "version": usa o packageManager do package.json (pnpm 12.6.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Papéis e banco de teste (mesmo bootstrap do ambiente local)
        run: node packages/database/scripts/bootstrap.mjs --databases liame_test

      - name: Chave mestra local do cofre, descartável, gerada nesta execução (ADR-011)
        run: echo "LIAME_KEK_LOCAL=1:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Migrations no banco de teste (mesmo executor da nuvem, ADR-018)
        run: pnpm db:migrate:test

      - name: Contrato OpenAPI atualizado (docs/openapi.json igual ao gerado do código)
        run: |
          pnpm openapi
          git diff --exit-code docs/openapi.json || { echo "::error::Contrato desatualizado: rode 'pnpm openapi' e faça commit de docs/openapi.json"; exit 1; }

      - name: Lint do contrato (Spectral 6.16.3)
        run: |
          curl -fsSL -o spectral https://github.com/stoplightio/spectral/releases/download/v6.16.3/spectral-linux-x64
          echo "b90ac8da7b804d04052b9db8d4ea5028d29fba9bc69b02dc85d46e5fcc476452  spectral" | sha256sum -c -
          chmod +x spectral
          ./spectral lint docs/openapi.json --ruleset .spectral.yaml --fail-severity=warn

      - name: Quebra de contrato (oasdiff 1.32.1)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'contrato-quebrado-aceito')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA:docs/openapi.json" 2>/dev/null; then
            echo "A base ainda não tem contrato: nada a comparar."; exit 0
          fi
          git show "$BASE_SHA:docs/openapi.json" > "$RUNNER_TEMP/openapi-base.json"
          curl -fsSL -o "$RUNNER_TEMP/oasdiff.tgz" https://github.com/oasdiff/oasdiff/releases/download/v1.32.1/oasdiff_1.32.1_linux_amd64.tar.gz
          echo "7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f  $RUNNER_TEMP/oasdiff.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oasdiff.tgz" -C "$RUNNER_TEMP" oasdiff
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/openapi-base.json" docs/openapi.json --fail-on ERR

      - name: Checar tipos (inclui os testes)
        run: pnpm typecheck

      - name: Testes, verificação das dependências e do rastreio
        run: pnpm test

  seguranca:
    name: segurança e cadeia de suprimentos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Segredos no histórico (gitleaks 8.30.1)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

      - name: Vulnerabilidades e licenças das dependências (osv-scanner 2.6.0)
        env:
          # Permissivas + copyleft fraco usado como biblioteca (MPL-2.0; LGPL do libvips do sharp).
          # GPL, AGPL e SSPL ficam fora (security-model.md §9).
          LICENCAS: MIT,Apache-2.0,MPL-2.0,ISC,BSD-3-Clause,BSD-2-Clause,0BSD,AFL-2.1,BlueOak-1.0.0,CC-BY-4.0,CC0-1.0,Python-2.0,LGPL-3.0-or-later
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source -r . --config osv-scanner.toml --licenses="$LICENCAS"

      - name: Workflows do GitHub (zizmor 1.30.1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.30.1 zizmor --format=github .github/workflows

      # mockups, docs e lia-agente-3d são material de referência (o kit da LIA dá 18 falsos positivos:
      # Math.random de animação e console.error no navegador). O que for para o app é varrido em apps/web.
      - name: Código (Semgrep CE 1.178.0 + regras do Liame)
        run: >-
          pipx run --spec semgrep==1.178.0 semgrep scan
          --config p/typescript --config p/nodejsscan --config p/secrets --config .semgrep
          --metrics=off --error --exclude mockups --exclude docs --exclude lia-agente-3d .

  imagem:
    name: imagem, SBOM e Grype
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Imagem do servidor (API e worker)
        run: docker build -f apps/server/Dockerfile -t liame-server:ci --build-arg APP_VERSION="${GITHUB_SHA::12}" .

      - name: Imagem do webapp
        run: docker build -f apps/web/Dockerfile -t liame-web:ci .

      - name: Fumaça - a imagem do servidor sobe sem root e responde /health com a versão
        run: |
          docker run -d --name api -p 3001:3001 -e NODE_ENV=development -e LIAME_KEK_LOCAL="1:$(openssl rand -base64 32)" liame-server:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3001/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:3001/health | grep -q "\"version\":\"${GITHUB_SHA::12}\""
          test "$(docker exec api id -u)" != "0"
          curl -fsSI http://127.0.0.1:3001/health | grep -qi "^x-content-type-options: nosniff"
          docker rm -f api

      - name: SBOM das imagens (Syft 1.52.0, CycloneDX)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/syft.tgz" https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          echo "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  $RUNNER_TEMP/syft.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tgz" -C "$RUNNER_TEMP" syft
          mkdir -p sbom
          "$RUNNER_TEMP/syft" liame-server:ci -o cyclonedx-json=sbom/imagem-servidor.cdx.json
          "$RUNNER_TEMP/syft" liame-web:ci -o cyclonedx-json=sbom/imagem-web.cdx.json

      # Sem "version": usa o packageManager do package.json (pnpm 12.6.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: SBOM do código (pnpm sbom, CycloneDX, só pelo lockfile)
        run: pnpm sbom --sbom-format cyclonedx --lockfile-only --out sbom/codigo.cdx.json

      - name: Vulnerabilidades das imagens (Grype 0.119.0; falha em crítico com correção)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/grype.tgz" https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_amd64.tar.gz
          echo "3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b  $RUNNER_TEMP/grype.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/grype.tgz" -C "$RUNNER_TEMP" grype
          "$RUNNER_TEMP/grype" sbom:sbom/imagem-servidor.cdx.json --only-fixed --fail-on critical
          "$RUNNER_TEMP/grype" sbom:sbom/imagem-web.cdx.json --only-fixed --fail-on critical

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          retention-days: 90
