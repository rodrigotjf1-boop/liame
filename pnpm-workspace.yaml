packages:
  - apps/*
  - packages/*

# Versão de cada dependência num lugar só (ADR-001), fixada. Os pacotes usam "catalog:".
# Atualizar de forma consciente: mudar aqui, rodar install, build e testes.
# O TypeScript fica no 6.0: a CLI do Nest 12 exige a API de compilador (o 7.0 não tem).
catalog:
  typescript: 6.0.3
  # three r147: a versão que o kit da LIA 3D usa (examples/js clássico, sem módulos). Atualizar = portar o kit (ux §6.1).
  three: 0.147.0
  # QR (MIT, sem dependências), desenhado em SVG por nós: o do app autenticador no web e o dos links de campanha no servidor (F5).
  uqr: 0.1.3
  turbo: 2.11.4
  '@types/node': 24.13.6

  '@nestjs/common': 12.1.0
  '@nestjs/core': 12.1.0
  '@nestjs/platform-express': 12.1.0
  '@nestjs/testing': 12.1.0
  '@nestjs/swagger': 12.0.2
  '@nestjs/cli': 12.0.6
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  zod: 4.6.5

  drizzle-orm: 0.45.3
  pg: 8.23.0
  '@types/pg': 8.23.1
  pg-boss: 12.34.0

  ai: 7.0.114
  # Adapter da Anthropic para o AI Gateway (A3, I1; ADR-006): a versão que usa o MESMO @ai-sdk/provider
  # (4.0.18) e provider-utils (5.0.47) do `ai` acima, para não duplicar os tipos do modelo.
  '@ai-sdk/anthropic': 4.0.63
  '@modelcontextprotocol/server': 2.1.0
  '@aws-sdk/client-kms': 3.1140.0
  # E-mail do serviço (SES v2, São Paulo): mesma versão do client-kms, para dividir o núcleo do SDK.
  '@aws-sdk/client-sesv2': 3.1140.0
  '@openfeature/server-sdk': 1.23.0
  '@openfeature/core': 1.12.0

  '@opentelemetry/api': 1.9.1
  '@opentelemetry/sdk-node': 0.222.0
  '@opentelemetry/sdk-trace-base': 2.11.0
  '@opentelemetry/instrumentation-http': 0.222.0
  '@opentelemetry/instrumentation-pg': 0.74.0
  '@opentelemetry/instrumentation-undici': 0.32.0
  '@opentelemetry/exporter-trace-otlp-proto': 0.222.0

  vitest: 5.0.1
  unplugin-swc: 2.0.0
  '@swc/core': 1.16.2

  next: 16.3.8
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3

  openapi-typescript: 7.13.0
  openapi-fetch: 0.17.0

# Scripts de instalação: só roda o que foi revisado (strictDepBuilds é padrão no pnpm 12).
# Revisados em 25/09/2026; nenhum é necessário:
# - @swc/core: só testa o binário nativo e, se falhar, instala @swc/wasm por fora do lockfile.
# - protobufjs: checa dependências da CLI pbjs, que não usamos.
# - @scarf/scarf: rastreador de instalação (vem do swagger-ui-dist).
allowBuilds:
  '@swc/core': false
  protobufjs: false
  '@scarf/scarf': false

# Versão com menos de 1 dia não entra, nem por exceção automática: o install falha e alguém decide.
minimumReleaseAgeStrict: true

# openapi-typescript 7.13 declara typescript ^5.x; testado com o 6.0.3 (gera e compila o SDK, 26/09/2026).
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: 6.0.3
